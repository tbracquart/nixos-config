config_version = 14

[audio]
enable_overdrive = true
enable_sounds = true
sound_volume = 0.99999997764825821

[bar.default]
background_opacity = 0.59999998658895493
capsule = true
center = [ "notifications", "notes", "clock", "media", "clipboard" ]
end = [ "tray", "group:g1", "screenshot", "session", "status" ]
start = [ "launcher", "workspaces", "group:g3", "group:g2" ]

    [bar.default.dead_zone.actions]
    middle = "settings-toggle"

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bluetooth", "volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "cpu", "temp", "ram" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "nix-monitor", "widget" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 20

[calendar]
enabled = true

    [calendar.account.personal_google]
    name = "Calendrier personnel"
    type = "google"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = true
background_opacity = 0.59999998658895493
enabled = true
pinned = [ "firefox", "nemo", "Alacritty", "geany" ]
reserve_space = false
show_dots = true
smart_auto_hide = true

[hot_corners.top_left]
action = "launcher"

[hot_corners.top_right]
action = "window_switcher"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
allow_empty_password = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@winit", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 196.0
    box_width = 810.0
    cx = 471.0
    cy = 322.0
    output = "winit"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 256.0
    box_width = 832.0
    cx = 960.0
    cy = 412.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "surface"
        format = "{:%H:%M:%S}"
        timezone = "Europe/Paris"

[notification]
background_opacity = 0.59999998658895493
position = "top_center"

[osd]
background_opacity = 0.59999998658895493

[plugin_settings."avivbintangaringga/nix-monitor"]
clean_command = "sudo nix profile wipe-history --profile /nix/var/nix/profiles/system --older-than 14d && sudo nix store gc"
optimize_command = "sudo nix store optimise -vv"
update_command = "git -C ~/nixos-config pull --ff-only && sudo nixos-rebuild switch --flake ~/nixos-config#ZenBook-13"

[plugin_settings."tphilippot/git_companion"]
repo = "tbracquart/nixos-config"

[plugins]
enabled = [
    "avivbintangaringga/nix-monitor",
    "aristides/udiskie",
    "noctalia/notes",
    "liamwh/emoji-picker",
    "tphilippot/git_companion"
]

[shell]
corner_radius_scale = 1.5000000223517418
launch_apps_as_systemd_services = true
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = false
settings_window_translucent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher.providers.windows]
    global = true

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_control_center = true
    open_near_click_launcher = true
    open_near_click_wallpaper = true
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "/home/thibaut/Images/Copies d'écran"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
custom_palette = "wp12329556-nixos-wallpapers-vib"
