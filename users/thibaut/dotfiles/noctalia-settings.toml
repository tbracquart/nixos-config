[wallpaper]
directory = "/home/thibaut/Images/Fonds d'écran"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/thibaut/Images/Fonds d'écran/aig27h1meoq11.jpg"

    [wallpaper.last]
    path = "/home/thibaut/Images/Fonds d'écran/aig27h1meoq11.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/thibaut/Images/Fonds d'écran/aig27h1meoq11.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/thibaut/Images/Fonds d'écran/wp12329556-nixos-wallpapers.png"
    theme_mode = "auto"
    wallpaper_scheme = "vibrant"

[widget.battery]
show_label = false

[widget.brightness]
show_label = false

[widget.clock]
format = "{:%H:%M | %x}"
timezone = "Europe/Paris"

[widget.media]
hide_when_no_media = true

[widget.network]
show_label = false

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.notes]
type = "noctalia/notes:notes"

[widget.notifications]
hide_when_no_unread = true

[widget.status]
hide_when_empty = true
type = "aristides/udiskie:status"

[widget.volume]
show_label = false

[widget.widget]
type = "tphilippot/git_companion:widget"
