name: Build host (reusable)

on:
  workflow_call:
    inputs:
      host:
        description: 'Nom du host NixOS à build (ex. ZenBook-13)'
        required: true
        type: string
      should-build:
        description: 'Indique si ce host doit réellement être buildé'
        required: false
        type: boolean
        default: true
      flake-lock-artifact:
        description: "Nom d'un artifact contenant un flake.lock à appliquer avant build (optionnel)"
        required: false
        type: string
        default: ''
      push-to-cachix:
        description: 'Publie le résultat du build sur Cachix (réservé aux workflows de confiance)'
        required: false
        type: boolean
        default: false
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false

permissions: {}

jobs:
  # Keep the reusable job itself conditional instead of conditionally invoking
  # the reusable workflow. This preserves the required `build-<host> / build`
  # check while letting GitHub skip the runner entirely for unaffected hosts.
  build:
    if: inputs.should-build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restaurer le flake.lock mis à jour
        if: inputs.flake-lock-artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.flake-lock-artifact }}

      # PR builds execute repository-controlled code, so they deliberately use
      # the cache setup without receiving the Cachix write credential.
      - uses: ./.github/actions/setup-nix-cachix
        if: inputs.push-to-cachix == false

      - uses: ./.github/actions/setup-nix-cachix
        if: inputs.push-to-cachix
        with:
          github-access-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build ${{ inputs.host }}
        env:
          HOST: ${{ inputs.host }}
        run: |
          set -eux
          nix build ".#nixosConfigurations.${HOST}.config.system.build.toplevel" -o result --no-update-lock-file --print-build-logs --accept-flake-config

      - name: Push build to Cachix
        if: inputs.push-to-cachix && env.CACHIX_AUTH_TOKEN != ''
        env:
          CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        run: |
          set -eux
          echo "Pushing build outputs to cachix tbracquart"
          cachix push tbracquart result
