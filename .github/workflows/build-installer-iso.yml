name: Construire l'ISO d'installation

on:
  push:
    branches:
      - main
    paths:
      - "flake.nix"
      - "flake.lock"
      - "config.nix"
      - "installer/**"
      - "common/**"
      - "modules/**"
      - "profiles/**"
      - "hosts/**"
      - "users/**"
      - "secrets/**"
      - "patches/**"
      - ".sops.yaml"
      - ".github/actions/setup-nix-cachix/**"
      - ".github/workflows/build-installer-iso.yml"
  workflow_dispatch:

concurrency:
  group: build-installer-iso-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Construire l'ISO d'installation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-cachix
        with:
          github-access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'ISO
        run: |
          set -eux
          nix build .#nixosConfigurations.installer.config.system.build.isoImage \
            -o result \
            --no-update-lock-file \
            --print-build-logs \
            --accept-flake-config

      - name: Mettre à jour la release rolling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view installer-latest >/dev/null 2>&1; then
            gh release create installer-latest \
              --title "Dernière ISO d'installation" \
              --latest=false \
              --notes "ISO NixOS d'installation reconstruite automatiquement depuis la branche main."
          fi

          # La release rolling ne doit contenir que l'image la plus récente.
          # Les noms des ISO changent avec la version de Nixpkgs, donc --clobber
          # seul ne suffit pas à remplacer l'ancien fichier.
          while IFS= read -r asset; do
            gh release delete-asset installer-latest "$asset" --yes
          done < <(gh release view installer-latest --json assets --jq '.assets[].name')

          gh release edit installer-latest --prerelease=false --latest=false

          gh release upload installer-latest result/iso/*.iso
