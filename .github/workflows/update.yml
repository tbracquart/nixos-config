name: Update flake

on:
  schedule:
    - cron: '17 6 * * *'  # tous les jours à 6h17 en Europe/Paris
      timezone: 'Europe/Paris'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      pr-title: ${{ steps.diff.outputs.title }}
      pr-body: ${{ steps.diff.outputs.body }}
      build-hosts: ${{ steps.diff.outputs.build-hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-cachix
        with:
          github-access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sauver flake.lock avant mise à jour
        run: cp flake.lock /tmp/flake.lock.before

      - name: Mettre à jour flake.lock
        id: update
        run: |
          nix flake update --accept-flake-config
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculer le diff des inputs et l'impact par host
        id: diff
        if: steps.update.outputs.changed == 'true'
        run: python3 .github/scripts/prepare-flake-update.py /tmp/flake.lock.before flake.lock . >> "$GITHUB_OUTPUT"

      - name: Sauver flake.lock mis à jour
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error
          retention-days: 1

  build-hosts:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.update.outputs.build-hosts) }}
    uses: ./.github/workflows/build-host.yml
    with:
      host: ${{ matrix.host }}
      flake-lock-artifact: flake-lock
      push-to-cachix: true
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  open-pr:
    needs: [update, build-hosts]
    if: >-
      always() &&
      needs.update.outputs.changed == 'true' &&
      (needs.build-hosts.result == 'success' || needs.build-hosts.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Récupérer le flake.lock mis à jour
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: flake-lock

      - name: Ouvrir une PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: ${{ needs.update.outputs.pr-title }}
          title: ${{ needs.update.outputs.pr-title }}
          body: |
            Mise à jour automatique quotidienne de `flake.lock`.

            ## Inputs mis à jour
            ${{ needs.update.outputs.pr-body }}

            Les hosts affectés ont déjà été buildés et poussés vers Cachix ; les checks de PR devraient donc pouvoir réutiliser ces résultats.
          branch: auto/flake-update
          delete-branch: true
          labels: |
            dependencies
            type: maintenance
            area: nix
