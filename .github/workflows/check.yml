name: NixOS CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      V145-15AST: ${{ steps.filter.outputs.V145-15AST }}
      ZenBook-13: ${{ steps.filter.outputs.ZenBook-13 }}
      flake: ${{ steps.filter.outputs.flake }}
      flake-lock: ${{ steps.filter.outputs.flake-lock }}
      flake-definition: ${{ steps.filter.outputs.flake-definition }}
      flake-impact-test: ${{ steps.filter.outputs['flake-impact-test'] }}
      ci-build: ${{ steps.filter.outputs['ci-build'] }}
    steps:
      # paths-filter uses the Git working tree for push events, so checkout is
      # required there. Pull requests use the GitHub REST API and skip it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            V145-15AST:
              - 'hosts/V145-15AST/**'
              - 'common/**'
              - 'modules/**'
              - 'profiles/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'
            ZenBook-13:
              - 'hosts/ZenBook-13/**'
              - 'common/**'
              - 'modules/**'
              - 'profiles/**'
              - 'users/thibaut/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'
            flake:
              - 'hosts/**'
              - 'common/**'
              - 'modules/**'
              - 'profiles/**'
              - 'users/**'
              - 'flake.nix'
              - 'flake.lock'
            flake-lock:
              - 'flake.lock'
            flake-definition:
              - 'flake.nix'
            # The regression suite uses synthetic lock graphs, so changing the
            # real flake.lock does not change what this test validates.
            flake-impact-test:
              - '.github/scripts/analyze-flake-impact.py'
              - '.github/scripts/test-analyze-flake-impact.py'
              - '.github/scripts/prepare-flake-update.py'
              - '.github/scripts/test-prepare-flake-update.py'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
            # Only changes to the reusable host build or its Nix/Cachix setup
            # can alter the actual NixOS build mechanism. Other CI changes are
            # validated by their dedicated checks without rebuilding hosts.
            ci-build:
              - '.github/workflows/build-host.yml'
              - '.github/actions/setup-nix-cachix/**'

      # Regression tests need the repository contents. On pushes the checkout
      # above is shared; on pull requests a separate checkout is needed only
      # when the regression test actually runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request' && steps.filter.outputs['flake-impact-test'] == 'true'
        with:
          persist-credentials: false

      - name: Vérifier les scripts d'analyse d'impact
        if: steps.filter.outputs['flake-impact-test'] == 'true'
        run: |
          python3 .github/scripts/test-analyze-flake-impact.py
          python3 .github/scripts/test-prepare-flake-update.py

  # Required check: keep this caller unconditional so GitHub always reports
  # `flake-check`. The actual Nix evaluation runs only when the flake or the
  # reusable host build mechanism can be affected.
  flake-check:
    needs: changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vérification non nécessaire
        if: needs.changes.outputs.flake != 'true' && needs.changes.outputs['ci-build'] != 'true'
        run: echo "Aucun changement affectant la flake ou le mécanisme de build CI — vérification ignorée"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.flake == 'true' || needs.changes.outputs['ci-build'] == 'true'
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-cachix # zizmor: ignore[self-repository] actionlint 1.7.12 ne reconnaît pas encore $/
        if: needs.changes.outputs.flake == 'true' || needs.changes.outputs['ci-build'] == 'true'

      - name: Vérification de la flake (évaluation seule, pas de build)
        if: needs.changes.outputs.flake == 'true' || needs.changes.outputs['ci-build'] == 'true'
        run: nix flake check --no-build --no-update-lock-file --keep-going --accept-flake-config

  # For a PR changing only flake.lock, use the analyzer to avoid rebuilding
  # hosts whose configuration does not reference the changed inputs.
  analyze-impact:
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.outputs.flake-lock == 'true' &&
      needs.changes.outputs.flake-definition != 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build-hosts: ${{ steps.analyze.outputs.build-hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Récupérer la version de base de flake.lock
        run: git fetch --no-tags origin '${{ github.event.pull_request.base.sha }}' --depth=1

      - name: Préparer les versions de flake.lock
        run: |
          git show '${{ github.event.pull_request.base.sha }}:flake.lock' > /tmp/flake.lock.before
          cp flake.lock /tmp/flake.lock.after

      - name: Analyser l'impact de flake.lock
        id: analyze
        run: |
          output=$(python3 .github/scripts/analyze-flake-impact.py \
            /tmp/flake.lock.before /tmp/flake.lock.after .)
          echo "$output"
          build_hosts=$(printf '%s\n' "$output" | sed -n 's/^build-hosts=//p')
          test -n "$build_hosts"
          echo "build-hosts=$build_hosts" >> "$GITHUB_OUTPUT"

  # Required checks `build-<host> / build` must remain visible. Therefore the
  # callers stay unconditional; the reusable workflow skips the runner when
  # the host is unaffected. Analyzer failures conservatively rebuild both.
  build-ZenBook-13:
    needs: [changes, analyze-impact]
    if: always()
    permissions:
      contents: read
    uses: ./.github/workflows/build-host.yml # zizmor: ignore[self-repository] actionlint 1.7.12 ne reconnaît pas encore $/
    with:
      host: ZenBook-13
      should-build: >-
        ${{ needs.changes.outputs.ZenBook-13 == 'true' ||
            needs.changes.outputs['ci-build'] == 'true' ||
            (needs['analyze-impact'].result == 'success' && contains(needs['analyze-impact'].outputs['build-hosts'], '\"ZenBook-13\"')) ||
            (needs.changes.outputs.flake-lock == 'true' && needs.changes.outputs.flake-definition != 'true' && needs['analyze-impact'].result != 'success') }}
      push-to-cachix: true
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      push-to-cachix: true
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-V145-15AST:
    needs: [changes, analyze-impact]
    if: always()
    permissions:
      contents: read
    uses: ./.github/workflows/build-host.yml # zizmor: ignore[self-repository] actionlint 1.7.12 ne reconnaît pas encore $/
    with:
      host: V145-15AST
      should-build: >-
        ${{ needs.changes.outputs.V145-15AST == 'true' ||
            needs.changes.outputs['ci-build'] == 'true' ||
            (needs['analyze-impact'].result == 'success' && contains(needs['analyze-impact'].outputs['build-hosts'], '\"V145-15AST\"')) ||
            (needs.changes.outputs.flake-lock == 'true' && needs.changes.outputs.flake-definition != 'true' && needs['analyze-impact'].result != 'success') }}
