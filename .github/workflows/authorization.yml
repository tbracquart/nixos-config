name: Autorisation des PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

concurrency:
  group: authorization-${{ github.event.pull_request.number || github.event.review.pull_request_url || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  authorization:
    name: authorization
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vérifier l'autorisation de la PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.review.pull_request_url && github.event.review.pull_request_url || '' }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login || '' }}
          REVIEW_STATE: ${{ github.event.review.state || '' }}
          REVIEW_COMMIT: ${{ github.event.review.commit_id || '' }}
        run: |
          set -euo pipefail

          # Les événements pull_request_review exposent la PR via review.pull_request_url.
          if [[ "$PR_NUMBER" == https://api.github.com/repos/*/pulls/* ]]; then
            PR_NUMBER="${PR_NUMBER##*/}"
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "Impossible de déterminer le numéro de la pull request."
            exit 1
          fi

          api_headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          pr_json="$(curl -fsSL --retry 3 --retry-delay 1 --retry-all-errors "${api_headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER")"

          author="$(jq -r '.user.login' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          echo "PR #$PR_NUMBER"
          echo "Auteur : $author"
          echo "Commit de tête : $head_sha"

          # Pour une approbation qui vient juste d'être soumise, utiliser
          # directement les informations de l'événement GitHub. Cela évite de
          # dépendre de la disponibilité immédiate de cette review dans l'API.
          if [ "$EVENT_NAME" = "pull_request_review" ] &&
             [ "$REVIEW_AUTHOR" = "tbracquart" ] &&
             [ "$REVIEW_STATE" = "approved" ] &&
             [ -n "$REVIEW_COMMIT" ] &&
             [ "$REVIEW_COMMIT" = "$head_sha" ]; then
            echo "Autorisé : @tbracquart vient d'approuver le commit de tête actuel."
            exit 0
          fi

          # Le propriétaire du dépôt est toujours autorisé à fusionner ses propres PR.
          if [ "$author" = "tbracquart" ]; then
            echo "Autorisé : propriétaire du dépôt."
            exit 0
          fi

          files="$(curl -fsSL --retry 3 --retry-delay 1 --retry-all-errors "${api_headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=1")"
          page=1
          while [ "$(jq 'length' <<<"$files")" -eq 100 ]; do
            page=$((page + 1))
            next_files="$(curl -fsSL --retry 3 --retry-delay 1 --retry-all-errors "${api_headers[@]}" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100&page=$page")"
            files="$(jq -s 'add' <(printf '%s\n' "$files") <(printf '%s\n' "$next_files"))"
          done

          # Seul Quentin bénéficie de l'exception de chemins délégués.
          if [ "$author" = "qbracquart" ]; then
            unauthorized="$(jq -r '.[] | .filename' <<<"$files" | while IFS= read -r file; do
              case "$file" in
                hosts/V145-15AST/*|users/quentin/*)
                  ;;
                *)
                  printf '%s\n' "$file"
                  ;;
              esac
            done)"

            if [ -z "$unauthorized" ]; then
              echo "Autorisé : tous les chemins modifiés sont délégués à @qbracquart."
              exit 0
            fi

            echo "Chemins non autorisés pour @qbracquart :"
            printf '%s\n' "$unauthorized"
          else
            echo "L'auteur de la PR n'est pas un collaborateur autorisé pour les chemins délégués."
          fi

          echo
          echo "Une approbation de @tbracquart est requise."

          reviews="$(curl -fsSL --retry 3 --retry-delay 1 --retry-all-errors "${api_headers[@]}" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100&page=1")"
          page=1
          while [ "$(jq 'length' <<<"$reviews")" -eq 100 ]; do
            page=$((page + 1))
            next_reviews="$(curl -fsSL --retry 3 --retry-delay 1 --retry-all-errors "${api_headers[@]}" \
              "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100&page=$page")"
            reviews="$(jq -s 'add' <(printf '%s\n' "$reviews") <(printf '%s\n' "$next_reviews"))"
          done

          approved="$(jq -r --arg sha "$head_sha" 'map(select(.user.login == "tbracquart" and .state == "APPROVED" and .commit_id == $sha)) | length' <<<"$reviews")"

          if [ "$approved" -gt 0 ]; then
            echo "Autorisé : @tbracquart a approuvé le commit de tête actuel."
            exit 0
          fi

          echo "Bloqué : aucune approbation de @tbracquart pour le commit de tête actuel."
          exit 1
