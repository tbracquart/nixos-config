name: 'Setup Nix + Cachix'
description: 'Installe Nix et active le cache Cachix tbracquart'

inputs:
  github-access-token:
    description: 'Jeton GitHub utilisé par Nix pour éviter les limites API'
    required: false
    default: ''
  cachix-auth-token:
    description: 'Jeton Cachix utilisé uniquement par les workflows de confiance'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        install_url: https://releases.nixos.org/nix/nix-2.35.2/install
        github_access_token: '${{ inputs.github-access-token }}'
        extra_nix_config: |
          experimental-features = nix-command flakes

    # Cachix provides the persistent Nix binary cache. Without an auth token,
    # the public cache is read-only; trusted workflows can also push to it.
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: tbracquart
        authToken: '${{ inputs.cachix-auth-token }}'
