name-template: 'Version $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

exclude-labels:
  - 'release: skip'
  - 'duplicate'
  - 'invalid'
  - 'wontfix'

categories:
  - title: '💥 Changements incompatibles'
    when:
      label: 'type: breaking'
  - title: '✨ Fonctionnalités'
    when:
      label: 'type: feature'
  - title: '🐛 Corrections'
    when:
      label: 'type: bug'
  - title: '🔧 Maintenance'
    when:
      label: 'type: maintenance'
  - title: '🛡️ Sécurité'
    when:
      label: 'type: security'
  - title: '📝 Documentation'
    when:
      label: 'type: documentation'
  - title: '📦 Autres changements'

  - type: version-resolver
    semver-increment: 'major'
    when:
      label: 'type: breaking'
  - type: version-resolver
    semver-increment: 'minor'
    when:
      label: 'type: feature'
  - type: version-resolver
    semver-increment: 'patch'
    when:
      labels:
        - 'type: bug'
        - 'type: maintenance'
        - 'type: security'
        - 'type: documentation'
        - 'dependencies'
  - type: version-resolver
    semver-increment: 'patch'

change-template: '- $BODY (#$NUMBER)'
change-title-escapes: '\\<*_&'
no-changes-template: '- Aucun changement'

template: |
  > Cette release est publiée automatiquement après la fusion d'une pull request publiable.

  ## Changements

  $CHANGES

autolabeler:
  - label: 'area: ci'
    files:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
  - label: 'area: installer'
    files:
      - 'installer/**'
  - label: 'area: nix'
    files:
      - 'flake.nix'
      - 'flake.lock'
      - 'common/**'
      - 'modules/**'
      - 'profiles/**'
      - 'hosts/**'
  - label: 'area: shell'
    files:
      - 'users/**/fish/**'
      - 'users/**/dotfiles/fish/**'
  - label: 'type: documentation'
    files:
      - '**/*.md'
      - 'docs/**'
