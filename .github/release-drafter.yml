name-template: 'Version $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

version-resolver:
  major:
    labels:
      - 'semver: major'
  minor:
    labels:
      - 'type: feature'
      - 'semver: minor'
  patch:
    labels:
      - 'type: bug'
      - 'type: maintenance'
      - 'type: security'
      - 'semver: patch'
  default: patch

exclude-labels:
  - 'release: skip'
  - 'duplicate'
  - 'invalid'
  - 'wontfix'
  - 'type: documentation'
  - 'area: ci'

categories:
  - title: '💥 Changements incompatibles'
    labels:
      - 'semver: major'
  - title: '✨ Fonctionnalités'
    labels:
      - 'type: feature'
  - title: '🐛 Corrections'
    labels:
      - 'type: bug'
  - title: '🔧 Maintenance'
    labels:
      - 'type: maintenance'
  - title: '🛡️ Sécurité'
    labels:
      - 'type: security'
  - title: '📝 Documentation'
    labels:
      - 'type: documentation'
  - title: '📦 Autres changements'
    labels:
      - '*'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\\<*_&'
no-changes-template: '- Aucun changement'

template: |
  > Cette release est publiée automatiquement après la fusion d'une pull request publiable.

  ## Changements

  $CHANGES

autolabeler:
  - label: 'area: ci'
    files:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/scripts/**'
  - label: 'area: installer'
    files:
      - 'installer/**'
  - label: 'area: nix'
    files:
      - 'flake.nix'
      - 'flake.lock'
      - 'common/**'
      - 'modules/**'
      - 'profiles/**'
      - 'hosts/**'
  - label: 'area: shell'
    files:
      - 'users/**/fish/**'
      - 'users/**/dotfiles/fish/**'
  - label: 'type: documentation'
    files:
      - '**/*.md'
      - 'docs/**'
